<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />

    <!--
      Minimal static fallback — ONLY page-invariant tags (same on every
      route), so there is never a duplicate with conflicting content once
      React mounts. Page-specific tags (title, description, canonical,
      og:title/description/url, twitter:title/description) are NOT
      duplicated here — they come solely from each route's <SEO> component
      (src/components/common/SEO.tsx) via React 19's native metadata
      hoisting.

      Why not duplicate those too "for non-JS bots": React does NOT remove
      or replace tags that were already in the static HTML — it only
      manages tags it renders itself. A static <title>/<link rel=canonical>
      here previously left TWO of each in the DOM on every route (verified
      via a live audit), always describing the homepage regardless of which
      page was open. Google explicitly warns that duplicate/conflicting
      canonical tags cause it to "make an unpredictable choice" — this was
      actively risking non-indexation of every case study and the blog
      page. Removing the page-varying static tags trades "non-JS bots get a
      slightly wrong preview on sub-pages" (the prior, worse state) for
      "non-JS bots get no preview on sub-pages, but JS-executing crawlers
      — which is effectively all of Google, Bing, and every major AI
      crawler today — see fully correct, page-specific, non-conflicting
      tags everywhere."
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anwar Alam" />
    <meta property="og:image" content="https://iamanwaralam.github.io/og/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://iamanwaralam.github.io/og/og-image.jpg" />
    <meta name="twitter:creator" content="@iamanwaralam" />

    <!-- No-flash theme: apply stored/system theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : true; // dark is the brand default
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>

    <!--
      Restores the real path after GitHub Pages' 404.html redirect trick
      (see public/404.html) — must run before React Router reads the URL.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
